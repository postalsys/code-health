name: Measure

on:
    schedule:
        # Mondays, after the weekend's releases
        - cron: '23 4 * * 1'
    workflow_dispatch:
    push:
        branches: [main]
        paths-ignore:
            - 'data/**'

permissions:
    contents: write
    pages: write
    id-token: write

concurrency:
    group: measure
    cancel-in-progress: false

jobs:
    measure:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7.0.1

            - uses: actions/setup-node@v7.1.0
              with:
                  node-version: 24

            - run: npm ci

            - run: npm test

            # The bare mirrors make a weekly run a fetch instead of a full clone
            - uses: actions/cache@v6.1.0
              with:
                  path: .cache/repos
                  key: mirrors-${{ github.run_id }}
                  restore-keys: mirrors-

            - run: npm run measure

            - name: Commit measurements
              run: |
                  git add data
                  if git diff --cached --quiet; then
                      echo "No new measurements"
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
                  git commit -m 'chore: update measurements'
                  git push

            # Renders the pages with EmailEngine's own admin UI partials and theme
            - run: npm run build

            - uses: actions/configure-pages@v6.0.0

            - uses: actions/upload-pages-artifact@v5.0.0
              with:
                  path: dist

    deploy:
        needs: measure
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5.0.1
